name: app-cd

# 운영 EC2(team05) 배포. main에 push되면(매일 05:00 KST dev→main 자동 머지 포함) 또는 Actions에서 직접 실행하면 돈다.
# 1) build: GitHub 러너에서 앱 이미지 9개(gateway·서비스 7개·web)를 빌드해 GHCR에 올린다. 매번 9개를 모두 빌드한다
# 2) deploy: EC2의 셀프호스티드 러너(라벨 crewrun-ec2)가 이미지를 받아 docker compose로 띄운다. EC2에서는 빌드하지 않는다
#
# 셀프호스티드 러너는 운영 서버에서 코드를 실행한다. 공개 저장소라 외부 PR이 이 러너를 쓰지 못하게 막아야 한다 (저장소·조직 설정, 러너 설치 방법은 이 파일을 추가한 PR 본문 참고)
on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 서버에서 compose가 동시에 돈다. 앞 배포를 끊지 않고 끝날 때까지 기다린다
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/prgrms-be-adv-devcourse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # 하나라도 실패하면 배포하지 않는다 (일부 서비스만 새 버전이 되는 것을 막는다)
      fail-fast: true
      matrix:
        include:
          - { name: gateway, context: backend, module: gateway }
          - { name: member-service, context: backend, module: member-service }
          - { name: cash-service, context: backend, module: cash-service }
          - { name: payout-service, context: backend, module: payout-service }
          - { name: file-service, context: backend, module: file-service }
          - { name: order-service, context: backend, module: order-service }
          - { name: product-service, context: backend, module: product-service }
          - { name: queue-service, context: backend, module: queue-service }
          # web은 SITE_URL·NEXT_PUBLIC_TOSS_CLIENT_KEY·NEXT_PUBLIC_GTM_ID·IMAGE_REMOTE_HOSTS를 빌드할 때 이미지에 고정한다 (저장소 Variables에서 읽음)
          - { name: web, context: frontend, module: '' }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 커밋 SHA 태그는 배포·되돌리기용, latest는 서버에서 직접 띄울 때용
      # cache: Docker 레이어를 GitHub 캐시에 이미지별로 저장해, 의존성 레이어 등이 그대로면 다시 만들지 않는다
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: |
            MODULE=${{ matrix.module }}
            ${{ matrix.name == 'web' && format('SITE_URL={0}', vars.SITE_URL) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_TOSS_CLIENT_KEY={0}', vars.NEXT_PUBLIC_TOSS_CLIENT_KEY) || '' }}
            ${{ matrix.name == 'web' && format('NEXT_PUBLIC_GTM_ID={0}', vars.NEXT_PUBLIC_GTM_ID) || '' }}
            ${{ matrix.name == 'web' && format('IMAGE_REMOTE_HOSTS={0}', vars.IMAGE_REMOTE_HOSTS) || '' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/bukang-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/bukang-${{ matrix.name }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: [self-hosted, crewrun-ec2]
    env:
      # 서버의 코드 폴더. .env(→ ~/workspace/.env)와 compose.override.yml이 여기 있어서 이 폴더에서 compose를 실행한다
      DEPLOY_DIR: /home/ubuntu/workspace/beadv8_1_BSB_MONO
      IMAGE_TAG: ${{ github.sha }}
    steps:
      # compose 파일·nginx 설정을 배포하는 커밋과 맞춘다. 서버 폴더에 커밋 안 된 수정이 있으면 여기서 멈춘다
      - name: 서버 코드를 배포 커밋으로 맞추기
        run: |
          cd "$DEPLOY_DIR"
          git fetch --quiet origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          git log --oneline -1

      - name: 이미지 받기
        working-directory: ${{ env.DEPLOY_DIR }}/backend
        run: |
          docker compose pull gateway member-service cash-service payout-service file-service \
            order-service product-service queue-service web

      # --wait: 모든 컨테이너가 healthy(healthcheck 없는 것은 running)가 될 때까지 기다리고, 실패하면 이 단계를 실패로 끝낸다
      - name: 띄우기
        working-directory: ${{ env.DEPLOY_DIR }}/backend
        run: docker compose up -d --no-build --wait --wait-timeout 600

      # 배포할 때마다 이미지 9개가 새로 쌓인다. 쓰지 않는 이미지 중 3일 넘은 것만 지운다 (그 안의 이미지로는 되돌릴 수 있다)
      - name: 오래된 이미지 정리
        if: always()
        run: docker image prune -af --filter "until=72h"
