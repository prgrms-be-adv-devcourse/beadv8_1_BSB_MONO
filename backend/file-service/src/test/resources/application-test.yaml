# 테스트 전용 설정 (@ActiveProfiles("test")로 활성화)
spring:
  datasource:
    # MySQL 대신 H2 인메모리 DB 사용 (MySQL 문법 호환 모드)
    url: jdbc:h2:mem:bukang-file-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: false
        format_sql: true
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      # 브로커 없이도 컨텍스트가 뜨도록 리스너 자동 시작을 끈다
      auto-startup: false

# 테스트는 개인 .env와 상관없이 로컬 S3Mock 값을 쓴다 (실제 S3에 요청하지 않는다)
file:
  storage:
    s3:
      bucket: bukang-file
      region: ap-northeast-2
      endpoint: http://localhost:9090
      public-endpoint: ""
      path-style: true
      access-key: s3mock
      secret-key: s3mock

logging:
  level:
    com.bukang: debug
    org.hibernate.SQL: debug
