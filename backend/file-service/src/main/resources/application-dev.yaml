spring:
  # 지금은 member-service와 같은 DB(bukang-db)를 쓰고, 테이블 이름 접두사(FILE_)로 구분한다
  datasource:
    url: jdbc:mysql://localhost:3306/bukang-db
    username: bukang2
    password: bukang2
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: false
        format_sql: true
        highlight_sql: true
    open-in-view: false

  kafka:
    bootstrap-servers:
      - localhost:9092

  # 업로드 테스트 페이지(dev-static/upload-test.html)는 dev 프로파일에서만 연다 (prod에서는 열리지 않는다)
  # 이 값을 정하면 Spring 기본 위치가 바뀌므로 기본 위치 4곳도 함께 적는다
  web:
    resources:
      static-locations:
        - classpath:/META-INF/resources/
        - classpath:/resources/
        - classpath:/static/
        - classpath:/public/
        - classpath:/dev-static/

logging:
  level:
    com.bukang: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
