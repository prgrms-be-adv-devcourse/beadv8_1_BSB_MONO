spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
    open-in-view: false

  # Spring Batch 실행 기록 테이블(BATCH_)은 JPA 엔티티가 아니라서 위 ddl-auto(validate)와 상관없다
  # Spring Batch의 SQL 스크립트로 처음 켤 때 만들고, 다음부터는 이미 있다는 오류를 무시한다 (DB 계정에 CREATE 권한 필요)
  batch:
    jdbc:
      initialize-schema: always

  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS}

# 운영은 기본값 없이 실제 AWS S3를 쓴다. 키를 비워 두면 SDK 기본 자격 증명 체인(EC2 역할 등)을 쓴다
# compose 앱 컨테이너는 compose.yml에서 S3Mock 값을 넘긴다
file:
  storage:
    s3:
      bucket: ${S3_BUCKET}
      region: ${AWS_REGION}
      endpoint: ${S3_ENDPOINT:}
      public-endpoint: ${S3_PUBLIC_ENDPOINT:}
      path-style: ${S3_PATH_STYLE:false}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}

# 운영에서는 API 구조가 외부에 노출되지 않도록 Swagger 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com:
      bukang: info
