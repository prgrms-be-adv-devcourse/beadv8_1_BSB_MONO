server:
  # member-service(8080), cash-service(8081), payout-service(8082)와 동시에 실행하므로 포트를 나눈다
  port: 8083

spring:
  application:
    name: file-service

  profiles:
    active: dev

  output:
    ansi:
      enabled: always

  # 개발 실행(bootRun/IDE) 시 backend/compose.yml의 인프라를 자동으로 띄운다
  # compose.yml과 .env 경로는 common의 LocalDevEnvironmentPostProcessor가 실행 위치와 상관없이 찾아 준다
  docker:
    compose:
      # 여러 서비스가 같은 인프라를 함께 쓰므로, 한 서비스를 종료해도 컨테이너는 멈추지 않는다
      lifecycle-management: start-only

  # Kafka 메시지는 JSON 문자열로 주고받는다 (이유는 member-service의 application.yaml과 README 참고)
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        # 구독한 토픽이 없으면 브로커에 자동 생성을 요청한다 (브로커도 자동 생성을 허용해야 동작)
        "[allow.auto.create.topics]": true

  # 파일 정리 배치(PRO-57). 켜 두면 앱을 켤 때마다 등록된 Job이 실행되므로 끈다 (Job은 스케줄러가 시작한다)
  batch:
    job:
      enabled: false

# 파일 저장소 (S3). 기본값은 compose의 로컬 S3Mock(localhost:9090)이다
# .env에 S3_ENDPOINT를 빈 값으로 두고 버킷·리전·키를 넣으면 실제 AWS S3를 쓴다 (.env.example 참고)
file:
  storage:
    s3:
      bucket: ${S3_BUCKET:bukang-file}
      region: ${AWS_REGION:ap-northeast-2}
      endpoint: ${S3_ENDPOINT:http://localhost:9090}
      public-endpoint: ${S3_PUBLIC_ENDPOINT:}
      path-style: ${S3_PATH_STYLE:true}
      # S3Mock은 키를 검사하지 않으므로 아무 값이나 넣는다
      access-key: ${S3_ACCESS_KEY:s3mock}
      secret-key: ${S3_SECRET_KEY:s3mock}
      # 업로드 URL은 바로 쓰므로 짧게, 이미지 URL은 화면을 보는 동안 열려야 하므로 길게 둔다
      upload-url-expiration: 10m
      download-url-expiration: 30m

# Swagger / OpenAPI V3 설정 (prod에서는 비활성화)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
  default-produces-media-type: application/json
  open-api:
    info:
      title: Bukang File API
      description: 크루 중심 마라톤 대회 예매·커머스 플랫폼 파일 API
      version: v1
