spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 표는 Flyway가 만들고 바꾼다. Hibernate는 엔티티와 표가 맞는지만 확인한다 (BE-024)
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
    open-in-view: false

  # 표 변경은 Flyway SQL(db/migration)로만 한다 (BE-024)
  # 이미 표가 있는 DB는 V1(기준선)을 실행하지 않고 "1번까지 됨"으로 표시만 한다
  # SQL 번호는 날짜·시각이라 머지 순서와 다를 수 있어 out-of-order를 켠다
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: true

  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS}

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}
    username: ${ELASTICSEARCH_USERNAME}
    password: ${ELASTICSEARCH_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

# 운영에서는 API 구조가 외부에 노출되지 않도록 Swagger 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# JWT 서명 키 (openssl rand -base64 64 로 생성한 값을 환경변수로 주입)
jwt:
  secret: ${JWT_SECRET}

# 민감 정보 변환 정보
crypto:
  password: ${CRYPTO_PASSWORD}
  salt: ${CRYPTO_SALT}
  hmac-secret: ${CRYPTO_HMAC_KEY}

logging:
  level:
    com:
      bukang: info