server:
  port: 8080

spring:
  application:
    name: member-service

  # 개발 실행(bootRun/IDE) 시 backend/compose.yml의 인프라를 자동으로 띄운다
  # compose.yml과 .env 경로는 common의 LocalDevEnvironmentPostProcessor가 실행 위치와 상관없이 찾아 준다
  docker:
    compose:
      # 여러 서비스가 같은 인프라를 함께 쓰므로, 한 서비스를 종료해도 컨테이너는 멈추지 않는다
      lifecycle-management: start-only

  profiles:
    active: dev

  output:
    ansi:
      enabled: always

  # Redis가 응답하지 않을 때 오래 기다리지 않도록 대기 시간을 줄인다 (Lettuce 기본값은 명령 60초, 연결 10초)
  # 로그인은 Redis 저장이 실패해도 진행하므로, 장애 때 로그인이 이 시간만큼만 늦어진다 (TokenIssueUseCase)
  # 접속 주소(host, port)는 프로파일별 yaml에 있다
  data:
    redis:
      timeout: 2s
      connect-timeout: 2s


  # Kafka
  ## JacksonJsonSerializer / JacksonJsonDeserializer 안쓴 이유

  ##① 역직렬화 실패 시 무한 루프 (가장 중요)
  ## JSON이 깨진 메시지가 하나라도 들어오면, JacksonJsonDeserializer가 예외를 던지고 컨슈머가 같은 offset을 계속 다시 읽습니다. 이른바 poison pill 문제입니다. ErrorHandlingDeserializer로 감싸면 실패한 메시지를 에러 핸들러로 넘기고 다음 메시지로 진행합니다.

  ## ② 타입 헤더에 FQCN이 박힘
  ## spring.json.add.type.headers:
  ##   true이면 __TypeId__ 헤더에 com.example.kafka.shared.member.event.MemberJoinedEvent처럼 클래스 전체 경로(FQCN)가 들어갑니다. 앞에서 이야기한 토픽명 문제와 같은 종류의 결합입니다. 패키지만 옮겨도 컨슈머가 역직렬화에 실패합니다. spring.json.type.mapping으로 논리적인 이름(예: memberJoined)을 쓰면 이 결합이 풀립니다.
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # 브로커 연결 대기 3초 (Kafka가 죽어 있으면 커밋 뒤 보내기가 가입 응답을 기본 60초 붙잡는다, BE-011)
        "[max.block.ms]": 3000

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        # 구독한 토픽이 없으면 브로커에 자동 생성을 요청한다 (브로커도 자동 생성을 허용해야 동작)
        "[allow.auto.create.topics]": true

# Swagger / OpenAPI V3 설정 (prod에서는 비활성화)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha            # 태그(컨트롤러) 이름순 정렬
    operations-sorter: method     # API를 HTTP 메서드순으로 정렬
    persist-authorization: true   # 입력한 JWT 토큰을 새로고침해도 유지
  default-produces-media-type: application/json
  open-api:
    info:
      title: Bukang Member API
      description: 크루 중심 마라톤 대회 예매·커머스 플랫폼 API
      version: v1

# JWT 유효 기간 (서명 키 jwt.secret은 프로파일별 yaml에 있다)
# refresh-token-expiration은 Refresh Token을 회전할 때마다 한 번에 늘리는 기간이다
jwt:
  access-token-expiration: 30m
  refresh-token-expiration: 14d

# Refresh Token 회전 정책 (RefreshTokenProperties). 회전은 member-service만 하므로 공용 jwt.*와 따로 둔다
member:
  auth:
    refresh-token:
      # 회전 직후 바로 전 토큰이 다시 와도 탈취로 보지 않는 시간 (탭 두 개, 동시 요청, 응답 유실)
      reuse-grace: 5s
      # 로그인부터 회전을 이어 갈 수 있는 최대 기간. 계속 써도 이 기간이 지나면 다시 로그인한다
      max-lifetime: 30d
