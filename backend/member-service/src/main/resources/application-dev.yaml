spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bukang-db
    username: bukang2
    password: bukang2
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 표는 Flyway가 만들고 바꾼다. Hibernate는 엔티티와 표가 맞는지만 확인한다 (BE-024)
      ddl-auto: validate
    properties:
      hibernate:
        # SQL은 System.out 대신 로거(org.hibernate.SQL)로 출력한다 (true면 로거와 중복 출력됨)
        show_sql: false
        format_sql: true
        highlight_sql: true
    open-in-view: false

  # 표 변경은 Flyway SQL(db/migration)로만 한다 (BE-024)
  # 이미 표가 있는 DB는 V1(기준선)을 실행하지 않고 "1번까지 됨"으로 표시만 한다
  # SQL 번호는 날짜·시각이라 머지 순서와 다를 수 있어 out-of-order를 켠다
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: true

  kafka:
    bootstrap-servers:
      - localhost:9092

  elasticsearch:
    uris: http://localhost:9200

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: jwt-dev-secret-key-1423-1126-7541-3217

