spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bukang-db
    username: bukang2
    password: bukang2
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 표는 Flyway가 만들고 바꾼다. Hibernate는 엔티티와 표가 맞는지만 확인한다 (BE-024)
      ddl-auto: validate
    properties:
      hibernate:
        # SQL은 System.out 대신 로거(org.hibernate.SQL)로 출력한다 (true면 로거와 중복 출력됨)
        show_sql: false
        format_sql: true
        highlight_sql: true
    open-in-view: false

  # 표 변경은 Flyway SQL(db/migration)로만 한다 (BE-024)
  # 모든 서비스가 같은 스키마를 쓰므로, 기록 표는 member 전용 이름으로 둔다 (다른 서비스가 Flyway를 붙여도 섞이지 않게)
  # 기준선을 0번으로 둬 V1(create table if not exists)은 항상 돈다. 다른 서비스 표만 있는 DB에서도 member 표가 생긴다
  # SQL 번호는 날짜·시각이라 머지 순서와 다를 수 있어 out-of-order를 켠다
  flyway:
    table: flyway_schema_history_member
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true

  kafka:
    bootstrap-servers:
      - localhost:9092

  elasticsearch:
    uris: http://localhost:9200

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: jwt-dev-secret-key-1423-1126-7541-3217

# 민감 정보 변환 정보
crypto:
  enabled: true # common global/crypto의 암호화 빈(TextEncryptor, EncryptedStringConverter)을 켠다
  hmac-secret: 5iXOaGlN4SRsdZBruRwXESrPF3qrRAiVpoRGyhCngqo=
  password: brH8W0e5axggiZDMxLeEcRiYSf5qght3KtDgWC+dT48=
  salt: d4cc93043cca7c91

logging:
  level:
    com.bukang: debug
    # 실행되는 SQL과 ? 자리에 바인딩되는 값 (Hibernate 6 이상 로거 이름)
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    # Elasticsearch 요청/응답 본문
    org.springframework.data.elasticsearch.client.WIRE: trace