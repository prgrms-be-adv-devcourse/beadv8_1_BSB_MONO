# 운영(EC2)에서만 compose.yml 위에 덮어쓰는 설정. Nginx에 HTTPS(Let's Encrypt 인증서)를 붙인다
# 로컬은 이 파일을 쓰지 않으므로 지금처럼 HTTP(80)로만 뜬다
#
# 실행: backend/.env에 아래 네 줄을 적어 두면 docker compose up -d --build 하나로 발급까지 끝난다 (.env.example 참고)
#   COMPOSE_FILE=compose.yml:compose.prod.yml
#   COMPOSE_PROFILES=app
#   DOMAIN=crewrun.duckdns.org
#   CERTBOT_EMAIL=...
#
# 처음 뜰 때 흐름: 인증서 없음 → Nginx는 HTTP 설정으로 뜸 → certbot이 80으로 소유 확인을 받아 발급
#   → Nginx(start-https.sh)가 1분 안에 인증서를 알아채 HTTPS 설정으로 바꾸고 reload
# 그 뒤: certbot이 12시간마다 갱신을 시도하고, 갱신되면 Nginx가 같은 방식으로 reload한다
# 인증서는 볼륨 certbot-conf에 남는다. docker compose down -v 로 볼륨을 지우면 처음부터 다시 발급한다 (Let's Encrypt 발급 횟수 제한 주의)
# !override는 Docker Compose 2.24.4 이상에서 동작한다

services:

  nginx:
    ports:
      - "443:443"
    # compose.yml의 volumes(로컬 default.conf)를 이어 붙이지 않고 통째로 바꾼다
    # conf.d/default.conf는 start-https.sh가 인증서 유무를 보고 템플릿으로 만든다
    volumes: !override
      - ./docker/nginx:/etc/nginx/crewrun:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN을 backend/.env에 적어 주세요}
    command: [ "/bin/sh", "/etc/nginx/crewrun/start-https.sh" ]
    # 서버가 재부팅되거나 컨테이너가 죽어도 다시 뜨게 한다
    restart: unless-stopped

  # 인증서 발급·갱신 (스크립트: docker/certbot/run.sh)
  certbot:
    image: certbot/certbot:v5.8.0
    container_name: bukang-certbot
    profiles: [ app ]
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - ./docker/certbot/run.sh:/crewrun/run.sh:ro
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN을 backend/.env에 적어 주세요}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?CERTBOT_EMAIL을 backend/.env에 적어 주세요}
    entrypoint: [ "/bin/sh", "/crewrun/run.sh" ]
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  # 인증서와 계정 정보 (/etc/letsencrypt). 지우면 다시 발급해야 한다
  certbot-conf:
  # Let's Encrypt 소유 확인용 토큰 파일. certbot이 쓰고 Nginx가 내보낸다
  certbot-www:
