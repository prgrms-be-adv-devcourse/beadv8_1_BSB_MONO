spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
    open-in-view: false

  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS}

# 다른 서비스는 실제 내부 API로 부른다. compose.yml의 앱 컨테이너끼리는 컨테이너 이름으로 접속한다
order:
  clients:
    product:
      mode: http
      base-url: http://bukang-product-service:8085
    payout:
      mode: http
      base-url: http://bukang-payout-service:8082
    cash:
      mode: http
      base-url: http://bukang-cash-service:8081
    # 프론트가 대기열 등록·순번 API를 부르기 전까지는 가짜(누구나 입장)로 둔다. 실제 대기열로 하면 아무도 등록되지 않아
    # [결제하기]가 모두 403이 된다. 프론트 연결 뒤 mode만 http로 바꾸면 아래 주소로 부른다 (PRO-226)
    queue:
      mode: fake
      base-url: http://bukang-queue-service:8086
    # 판매자 ID 조회를 실제로 붙이기 전까지 운영에서는 판매자 키트 API를 막는다 (가짜는 누구나 판매자로 봄, PRO-197)
    seller:
      mode: disabled

# 운영에서는 API 구조가 외부에 노출되지 않도록 Swagger 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com:
      bukang: info
