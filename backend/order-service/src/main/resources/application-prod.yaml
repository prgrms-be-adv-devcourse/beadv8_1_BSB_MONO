spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 표는 Flyway가 만들고 바꾼다. Hibernate는 엔티티와 표가 맞는지만 확인한다 (BUK-29)
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
    open-in-view: false

  # 표 변경은 Flyway SQL(db/migration)로만 한다 (BUK-29)
  # 모든 서비스가 같은 스키마를 쓰므로, 기록 표는 order 전용 이름으로 둔다 (회원의 flyway_schema_history_member와 섞이지 않게)
  # 기준선을 0번으로 둬 V1(create table if not exists)은 항상 돈다. 주문 표가 이미 있는 DB에서는 아무것도 바꾸지 않는다
  # SQL 번호는 날짜·시각이라 머지 순서와 다를 수 있어 out-of-order를 켠다
  flyway:
    table: flyway_schema_history_order
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true

  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS}

# 다른 서비스는 실제 내부 API로 부른다. compose.yml의 앱 컨테이너끼리는 컨테이너 이름으로 접속한다
order:
  clients:
    product:
      mode: http
      base-url: http://bukang-product-service:8085
    payout:
      mode: http
      base-url: http://bukang-payout-service:8082
    cash:
      mode: http
      base-url: http://bukang-cash-service:8081
    # 대기열 입장 확인은 실제 대기열 서비스에 묻는다 (PRO-226). 프론트가 대기 화면에서 등록·순번 조회를 한 뒤 묻는다(PRO-251)
    # 대기열 대회 복제본에 없는 대회는 줄을 설 수 없어 결제까지 못 간다. 막히면 mode를 fake(누구나 입장)로 되돌린다 (PRO-248)
    queue:
      mode: http
      base-url: http://bukang-queue-service:8086
    # 판매자 ID 조회를 실제로 붙이기 전까지 운영에서는 판매자 키트 API를 막는다 (가짜는 누구나 판매자로 봄, PRO-197)
    seller:
      mode: disabled

# 운영에서는 API 구조가 외부에 노출되지 않도록 Swagger 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com:
      bukang: info
