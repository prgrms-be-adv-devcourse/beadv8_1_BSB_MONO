spring:
  # 지금은 member-service와 같은 DB(bukang-db)를 쓰고, 테이블 이름 접두사(ORDER_)로 구분한다
  datasource:
    url: jdbc:mysql://localhost:3306/bukang-db
    username: bukang2
    password: bukang2
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 표는 Flyway가 만들고 바꾼다. Hibernate는 엔티티와 표가 맞는지만 확인한다 (BUK-29)
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: true
        highlight_sql: true
    open-in-view: false

  # 표 변경은 Flyway SQL(db/migration)로만 한다 (BUK-29)
  # 모든 서비스가 같은 스키마를 쓰므로, 기록 표는 order 전용 이름으로 둔다 (회원의 flyway_schema_history_member와 섞이지 않게)
  # 기준선을 0번으로 둬 V1(create table if not exists)은 항상 돈다. 주문 표가 이미 있는 DB에서는 아무것도 바꾸지 않는다
  # SQL 번호는 날짜·시각이라 머지 순서와 다를 수 있어 out-of-order를 켠다
  flyway:
    table: flyway_schema_history_order
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true

  kafka:
    bootstrap-servers:
      - localhost:9092

logging:
  level:
    com.bukang: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
