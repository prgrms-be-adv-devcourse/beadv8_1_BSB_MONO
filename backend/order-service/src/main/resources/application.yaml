server:
  # member-service(8080), cash-service(8081), payout-service(8082), file-service(8083)와 동시에 실행하므로 포트를 나눈다
  port: 8084

spring:
  application:
    name: order-service

  profiles:
    active: dev

  output:
    ansi:
      enabled: always

  # 개발 실행(bootRun/IDE) 시 backend/compose.yml의 인프라를 자동으로 띄운다
  # compose.yml과 .env 경로는 common의 LocalDevEnvironmentPostProcessor가 실행 위치와 상관없이 찾아 준다
  docker:
    compose:
      # 여러 서비스가 같은 인프라를 함께 쓰므로, 한 서비스를 종료해도 컨테이너는 멈추지 않는다
      lifecycle-management: start-only

  # Kafka 메시지는 JSON 문자열로 주고받는다 (이유는 member-service의 application.yaml과 README 참고)
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # 브로커가 없을 때 send()가 기다리는 시간 (기본 60초). 만료 처리 한 건이 오래 붙잡히지 않게 줄인다 (PRO-166)
        max.block.ms: 3000

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        # 구독한 토픽이 없으면 브로커에 자동 생성을 요청한다 (브로커도 자동 생성을 허용해야 동작)
        "[allow.auto.create.topics]": true

# Swagger / OpenAPI V3 설정 (prod에서는 비활성화)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
  default-produces-media-type: application/json
  open-api:
    info:
      title: Bukang Order API
      description: 크루 중심 마라톤 대회 예매·커머스 플랫폼 예매·주문 API
      version: v1

# 다른 서비스 호출 (PRO-99). mode가 fake면 가짜 어댑터가 답하고, http면 실제 내부 API(/internal/v1/...)를 부른다
# 로컬 개발은 다른 서비스를 띄우지 않아도 되게 fake가 기본이고, 운영(prod)은 http다
order:
  clients:
    # 연결·응답 시간 제한. 넘으면 503으로 다시 시도하게 한다
    timeout: 2s
    product:
      mode: fake
      base-url: http://localhost:8085
    payout:
      mode: fake
      base-url: http://localhost:8082
    cash:
      mode: fake
      base-url: http://localhost:8081
    # 대기열 입장 확인 (PRO-191). 대기열 내부 API(PRO-182)가 나오기 전이라 fake만 있다(http는 아직 없어 켜면 앱이 뜨지 않는다)
    queue:
      mode: fake
      # 가짜 대기열의 입장 시간(1~10분). 만료를 빨리 확인하려면 줄인다 (정책은 10분). 더미 페이지: http://localhost:8084/dev/queue-dummy
      fake-admission-minutes: 10
    # 판매자 키트 API의 판매자 ID 조회 (PRO-197). 실제 연결 전이라 fake(회원 ID = 판매자 ID)만 있다. 운영은 disabled
    seller:
      mode: fake
