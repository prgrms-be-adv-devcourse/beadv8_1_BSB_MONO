# 테스트 전용 설정 (@ActiveProfiles("test")로 활성화)
spring:
  datasource:
    # MySQL 대신 H2 인메모리 DB 사용 (MySQL 문법 호환 모드)
    url: jdbc:h2:mem:bukang-payout-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: false
        format_sql: true
    open-in-view: false

logging:
  level:
    com.bukang: debug
    org.hibernate.SQL: debug

# 테스트는 주문 서비스를 띄우지 않는다. 어댑터를 만들 수 있게 주소만 둔다 (배치 테스트는 가짜 포트, 어댑터 테스트는 MockRestServiceServer)
payout:
  services:
    order: http://localhost:8084
