# 서버의 유일한 입구(80). /api는 게이트웨이로, 나머지 화면 요청은 Next.js로 넘긴다
# 컨테이너 이름은 compose.yml의 container_name과 같다. Nginx는 시작할 때 이 이름을 찾으므로 두 컨테이너가 먼저 떠 있어야 한다
upstream gateway {
	server bukang-gateway:8000;
}

upstream web {
	server bukang-web:3000;
}

server {
	listen 80;
	server_name _;

	# 파일 본문은 presigned URL로 S3에 바로 올리므로 API 요청 본문은 작다. 엑셀 명단 같은 예외를 고려해 여유를 둔다
	client_max_body_size 10m;

	# 뒤쪽 앱이 원래 요청 주소와 접속자 IP를 알 수 있게 넘긴다 (location에서 proxy_set_header를 다시 쓰면 이 값이 사라진다)
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

	# proxy_pass 뒤에 경로(/)를 붙이지 않아야 /api/v1/... 주소가 잘리지 않고 그대로 넘어간다 (게이트웨이도 자르지 않는다)
	location /api/ {
		proxy_pass http://gateway;
	}

	# 서비스끼리만 쓰는 주소. 게이트웨이도 막지만 입구에서 한 번 더 막는다
	location /internal/ {
		return 404;
	}

	location / {
		proxy_pass http://web;
	}
}
