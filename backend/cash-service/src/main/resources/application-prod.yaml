spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false
    open-in-view: false

  kafka:
    bootstrap-servers:
      - ${KAFKA_BOOTSTRAP_SERVERS}

# 운영에서는 API 구조가 외부에 노출되지 않도록 Swagger 비활성화
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

cash:
  clients:
    pg:
      mode: http
      secret-key: ${TOSS_SECRET_KEY}

# 계좌번호·pgPaymentKey 암호화 키
crypto:
  password: ${CASH_CRYPTO_PASSWORD}
  salt: ${CASH_CRYPTO_SALT}

logging:
  level:
    com:
      bukang: info
