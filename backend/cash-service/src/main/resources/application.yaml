server:
  # member-service(8080)와 동시에 실행하므로 포트를 나눈다
  port: 8081

spring:
  application:
    name: cash-service

  profiles:
    active: dev

  output:
    ansi:
      enabled: always

  # 개발 실행(bootRun/IDE) 시 backend/compose.yml의 인프라를 자동으로 띄운다
  # compose.yml과 .env 경로는 common의 LocalDevEnvironmentPostProcessor가 실행 위치와 상관없이 찾아 준다
  docker:
    compose:
      # 여러 서비스가 같은 인프라를 함께 쓰므로, 한 서비스를 종료해도 컨테이너는 멈추지 않는다
      lifecycle-management: start-only

  # Kafka 메시지는 JSON 문자열로 주고받는다 (이유는 member-service의 application.yaml과 README 참고)
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        # 구독한 토픽이 없으면 브로커에 자동 생성을 요청한다 (브로커도 자동 생성을 허용해야 동작)
        "[allow.auto.create.topics]": true

# Swagger / OpenAPI V3 설정 (prod에서는 비활성화)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    persist-authorization: true
  default-produces-media-type: application/json
  open-api:
    info:
      title: Bukang Cash API
      description: 크루 중심 마라톤 대회 예매·커머스 플랫폼 캐시 API
      version: v1

# 시스템 지갑(수수료 수익)·홀딩 지갑(정산 전 보관)의 회원 ID (docs/erd/cash.md 홀딩 지갑)
cash:
  wallet:
    system-member-id: 1
    holding-member-id: 2
  charge:
    confirm:
      max-wait-attempts: 20
      wait-interval-millis: 100

  # PG(Toss페이먼츠) 결제 승인 연동 (PRO-81). mode가 fake면 가짜로 바로 승인하고, http면 실제 Toss API를 부른다
  # 로컬 개발·테스트는 Toss 서버를 안 거쳐도 되게 fake가 기본이고, 운영(prod)은 http다
  clients:
    pg:
      mode: fake
      base-url: https://api.tosspayments.com
      # 연결·응답 시간 제한. 넘으면 PaymentApprovalFailedException(503)으로 다시 시도하게 한다
      timeout: 5s
