spring:
  # 지금은 member-service와 같은 DB(bukang-db)를 쓰고, 테이블 이름 접두사(CASH_)로 구분한다
  datasource:
    url: jdbc:mysql://${DEV_DB_HOST:localhost}:3306/bukang-db
    username: bukang2
    password: bukang2
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: false
        format_sql: true
        highlight_sql: true
    open-in-view: false

  kafka:
    bootstrap-servers:
      - ${DEV_KAFKA_SERVERS:localhost:9092}

logging:
  level:
    com.bukang: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

